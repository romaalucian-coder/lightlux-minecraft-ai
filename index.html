
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LAN Buddy</title>
<style>
body {
  margin: 0;
  padding: 24px;
  background: #101426;
  color: white;
  font: 17px Arial, sans-serif;
}
main {
  max-width: 600px;
  margin: 30px auto;
  padding: 24px;
  background: #202944;
  border-radius: 18px;
}
h1 { color: #b9a2ff; }
#status { color: #65f0d2; }
button {
  margin: 6px 3px;
  padding: 12px 16px;
  border: 0;
  border-radius: 9px;
  background: #a78bfa;
  color: #17122b;
  font-weight: bold;
  cursor: pointer;
}
#chat {
  padding: 15px;
  min-height: 90px;
  background: #131b30;
  border-radius: 10px;
  white-space: pre-wrap;
}
</style>
</head>
<body>
<main>
  <h1>🤖 LAN Buddy</h1>
  <p id="status">Status: Offline</p>
  <div id="chat">Your AI teammate is ready.</div>

  <button onclick="startWaiting()">Start waiting</button>
  <button onclick="playerJoined()">Simulate player joining</button>
  <button onclick="answer(true)">Yes</button>
  <button onclick="answer(false)">Not yet</button>
  <button onclick="resetBot()">Reset</button>
</main>

<script>
let state = "idle";

function say(message) {
  document.getElementById("chat").textContent = message;
}

function status(message) {
  document.getElementById("status").textContent =
    "Status: " + message;
}

function startWaiting() {
  state = "waiting";
  status("Waiting for another player...");
  say("I'm waiting for someone to join your world.");
}

function playerJoined() {
  if (state !== "waiting") {
    say("Start waiting first!");
    return;
  }

  state = "asking";
  status("Player detected (simulated)");
  say("Hi! Are you ready?");
}

function answer(yes) {
  if (state !== "asking") {
    say("There isn't a question waiting for an answer yet.");
    return;
  }

  if (yes) {
    state = "playing";
    status("Ready to play!");
    say("Awesome! Let's play Minecraft together! 🎮");
  } else {
    state = "waiting";
    status("Waiting for readiness");
    say("No problem! I'll wait until you're ready.");
  }
}

function resetBot() {
  state = "idle";
  status("Offline");
  say("Your AI teammate is ready.");
}
</script>
</body>
</html>
